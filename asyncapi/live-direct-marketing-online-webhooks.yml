  neither GitHub repository carries an event specification. The event surface below is documented
  in prose and in the Webhooks tag of the OpenAPI (7 operations). Nothing was fabricated.
surface: Outbound HTTPS webhook deliveries for CRM lead, inbox dialog and mailing task events
