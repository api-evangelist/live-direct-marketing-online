inbox_check_webhooks:
  note: >-
    The Inbox Check monitoring settings (PATCH /api/v1/monitoring/settings, schema UpdateSettingsDto)
    accept webhookUrl (uri, <= 2048) and webhookSecret (<= 256) for domain-monitoring alerts alongside
