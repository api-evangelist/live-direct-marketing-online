summary: 'Derived from id-reference fields in request DTOs and from the resource paths. LDM links by id field, not
  by $ref nesting: the 224 components are almost all request DTOs (Create*/Update*Dto), so response shapes are not
  in the contract and the graph below is reconstructed from foreign-key style properties (<entity>Id) and the URL
  hierarchy. Tenant is the root — every one of the 1,304 operations declares the X-Tenant-Id header. Inbox Check
  is a separate, much smaller model rooted in the API key: a Test (addressed by an opaque token) owns per-provider
  seed results; a monitored Domain owns Checks; a SenderLink is a permanent public page over a sender''s seed addresses.'
