inbox_check:
  entities:
  - name: ApiKey
    description: icp_live_* key with tier (basic/pro/enterprise), scopes, allowed_providers, daily/monthly counters
      (GET /api/v1/me).
    schemas:
    - CreateApiKeyDto
    - UpdateApiKeyDto
    - CreateAccountKeyDto
    relationships:
    - has_many: Test
    - has_many: MonitoredDomain (user-bound keys only)
  - name: Test
    description: 'Deliverability test addressed by opaque token: status waiting/done/expired, send_to[] seed addresses,
      per-seed results (placement, spf/dkim/dmarc, screenshot_url), summary, verdict, recommendations; deferred
      rechecks; 7-day retention.'
    schemas:
    - CreateTestDto
    - CreateV1TestDto
    - CreateV1AutoTestDto
    - ScheduleDeferredRecheckDto
    - RecheckDto
    - CreateOAuthTestDto
    relationships:
    - belongs_to: ApiKey
    - has_many: SeedResult
      via: provider
    - has_many: Recheck
    - has_one: Report (JSON or PDF)
  - name: Provider
    description: Mailbox provider (gmail, outlook, yahoo, icloud, aol, gmx, web.de, t-online, mail.ru, yandex) with
      seed pool and delivery blocks; keys carry an allowlist.
    schemas:
    - CreateProviderDto
    - PatchProviderDto
    - AddDeliveryBlockDto
    relationships:
    - has_many: Seed
    - has_many: DeliveryBlock
      via: blockId
  - name: MonitoredDomain
    description: Domain under recurring SPF/DMARC/MX/blocklist/TLS checks; pause/resume/run; history of Checks;
      100 per account.
    schemas:
    - AddDomainDto
    - UpdateDomainDto
    - UpdateSettingsDto
    relationships:
    - belongs_to: ApiKey owner
    - has_many: Check
    - notified_via: email / webhookUrl / Telegram (MonitoringSettings)
  - name: SenderLink
    description: 'Permanent public sender page: seed addresses, latest runs, report state; revoke/reactivate; List-Unsubscribe
      target.'
    schemas:
    - SetReportsDto
    relationships:
    - has_many: Run
  - name: DomainWatch / Subscription
    description: Consent-gated per-domain email reports (double opt-in, RFC 8058 one-click unsubscribe).
    schemas:
    - WatchRequestDto
    - WatchTokenDto
    - WatchEmailDto
    - WatchStopDto
    - SubscribeDto
    relationships:
    - belongs_to: MonitoredDomain
  id_reference_fields: []
