  LDM MCP tools. 34 of the 47 distinct ldm_* tool references in the pack resolve to an operationId in the harvested
  LDM v3 OpenAPI under the provider''s ldm_<operationId> rule; the remaining 13 are short-form aliases (ldm_companies_list,
  ldm_creatives_create, ldm_dialogs_list, ...) whose backing operations were not confirmed without an authenticated
  tools/list.'
