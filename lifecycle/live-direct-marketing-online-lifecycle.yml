  note: >-
    Zero of 1,304 LDM operations and zero of 196 Inbox Check operations carry deprecated: true;
    no Sunset or Deprecation header is declared or documented. Evidence of change without
    deprecation exists on the agent side: the proprietary card notes "Self-serve signup was removed
    in 2026-05" while the live A2A card and docs describe self-serve signup as available again;
