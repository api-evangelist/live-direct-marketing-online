conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 0.3.0
  preferred_transport: null
  transport: JSONRPC (0.3.0 default when preferredTransport is absent)
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: 'Graded against the A2A 1.0.0 hard checks. capabilities is an OBJECT (streaming: true, pushNotifications:
    true, stateTransitionHistory: false) — pass. protocolVersion is present at the top level, ''0.3.0'' — pass.
    skills is an ARRAY of 237 fully-populated entries (id, name, description, tags, inputModes, outputModes) — pass.
    Both defaultInputModes and defaultOutputModes are declared. preferredTransport is absent; A2A 0.3.0 defines
    it as optional with JSONRPC as the default, so its absence is spec-permitted rather than a deviation, and the
    card is 0.3.0-shaped throughout (top-level url + protocolVersion, flat securitySchemes).'
  deviations:
  - field: url
    observed: https://api.live-direct-marketing.online/a2a
    note: GET returns 404; POST is answered 401 by the dispatcher whose instance is /api/a2a. Functionally reachable,
      but a client that probes the URL with GET first will read it as dead.
  - field: skills
    observed: 237 of a declared 1,270 (curated subset; ?full=1 returns all)
    note: 'The card itself is a projection: a peer reading only the default document sees 19% of the skill catalog.
      Each skill description is a mechanical "summary — METHOD /path (scope x:y)" string generated from the OpenAPI,
      and tags are duplicated pairs (e.g. ["notifications","notifications"]).'
  - field: skills[].examples / inputModes
    observed: no examples; every skill inputModes/outputModes = application/json
    note: No per-skill security requirements; a single top-level bearer requirement covers all 237.
  - field: securitySchemes.bearer.bearerFormat
    observed: ldm_*
    note: Consistent with the docs (ldm_ + 64 hex). The OpenAPI, by contrast, declares bearerFormat JWT for the
      same key — the card is the more accurate of the two.
  - field: non-standard top-level fields
    observed: skills_total, skills_note, scopes[79], signup{}, contact{}
    note: Vendor extensions carried without an x- prefix; harmless to A2A parsers but not part of the schema.
  - field: protocolVersion across hosts
    observed: 0.3.0 on api host and apex/app pointer cards; 0.2.5 on the developer-portal pointer card
    note: Inconsistent self-description across the five hosts that serve a card.
  - field: iconUrl / documentationUrl / supportsAuthenticatedExtendedCard / signatures
    observed: absent
    note: Optional fields; the docs URL lives only in the proprietary card and the agent guide.
