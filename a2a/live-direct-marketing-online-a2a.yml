  host: api.live-direct-marketing.online
  note: 'The A2A-shaped card is served at the legacy /.well-known/agent.json path BY DESIGN: the provider''s own
    developer docs call agent.json ''the A2A-compliant variant'' and agent-card.json ''the LDM-proprietary shape''.
    The canonical path /.well-known/agent-card.json on the same host answers 200 but carries the proprietary card
    (schema_version 1.0.0, capabilities as an ARRAY of 237 REST-bound entries with inputSchema) which fails the
    A2A hard checks; it is saved alongside as a2a/live-direct-marketing-online-agent-card-proprietary.json. Both
    cards are generated dynamically from the running API (the OpenAPI declares them as operations AgentCardController_*
    under /api/v1/.well-known/), so the numbers below will drift.'
  previously: First profile — the harvest stub (source a2aregistry.org, 2026-09-19) pointed only at the Inbox Check
    card on check.live-direct-marketing.online; this pass found the LDM.delivery card on the api host, pointer cards
    on the apex, app and developer-portal hosts, and the Inbox Check card, and graded the LDM.delivery card as primary
    because it is the only one with an A2A JSON-RPC transport.
