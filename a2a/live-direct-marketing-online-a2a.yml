    follow the vendor skills_endpoint field learns nothing. Byte-identical copies on app.live-direct-marketing.online;
    a 0.2.5 variant on developers.live-direct-marketing.online.
surface_relationship:
  note: 'Live Direct Marketing publishes three agent surfaces over one data core and the A2A card is the broadest,
    not the narrowest: A2A — 1,270 skills (237 curated) behind POST /api/a2a; MCP — the same operations as tools
    named ldm_<operationId> at https://api.live-direct-marketing.online/mcp, with an anonymous bootstrap of three
    tools; REST — 1,304 operations in the OpenAPI at /api/docs-json. Because all three are generated from the same
    OpenAPI, the crosswalk in mcp/live-direct-marketing-online-tool-crosswalk.yml is mechanical and high-confidence.
    Inbox Check is a separate product with its own 196-operation OpenAPI, its own MCP server and a discovery-only
    card.'
