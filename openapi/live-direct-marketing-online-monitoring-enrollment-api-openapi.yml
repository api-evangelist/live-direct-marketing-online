openapi: 3.2.0
info:
  title: inbox-check Monitoring Enrollment API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: monitoring-enrollment
paths:
  /api/monitoring-enrollment:
    post:
      operationId: MonitoringEnrollmentController_enroll
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringEnrollmentDto'
      responses:
        '200':
          description: ''
      tags:
      - monitoring-enrollment
      summary: Monitoring enrollment controller enroll
      x-summary-source: derived
components:
  schemas:
    MonitoringEnrollmentDto:
      type: object
      properties: {}
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
