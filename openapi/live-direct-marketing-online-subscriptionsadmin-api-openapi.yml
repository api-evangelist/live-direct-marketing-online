openapi: 3.2.0
info:
  title: inbox-check Subscriptions Admin API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: SubscriptionsAdmin
paths:
  /api/admin/subscriptions:
    get:
      operationId: SubscriptionsAdminController_list
      parameters:
      - name: limit
        required: false
        in: query
        schema:
          type: string
      - name: offset
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - SubscriptionsAdmin
      summary: Subscriptions admin controller list
      x-summary-source: derived
  /api/admin/subscriptions/stats:
    get:
      operationId: SubscriptionsAdminController_stats
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - SubscriptionsAdmin
      summary: Subscriptions admin controller stats
      x-summary-source: derived
components:
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
