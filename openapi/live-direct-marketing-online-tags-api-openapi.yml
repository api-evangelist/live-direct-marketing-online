components:
  schemas:
    AttachTagDto:
      type: object
      properties:
        tagId:
          type: string
      required:
      - tagId
    UpdateTagDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
    CreateTagDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        color:
          type: string
      required:
      - name
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
