        description: Legacy single-source filter (use `sources` instead)
        schema:
          type: string
      - name: sources
        required: false
        in: query
        description: CSV of contactList,company,pipeline
        schema:
          type: string
      - name: contactListId
        required: false
        in: query
        schema:
          type: string
      - name: companyId
        required: false
        in: query
        schema:
          type: string
      - name: pipelineId
        required: false
        in: query
        schema:
          type: string
      - name: stageId
        required: false
        in: query
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: List available template variables
