components:
  schemas:
    GeneratePdfMetadataDto:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        subject:
          type: string
        keywords:
          type: array
          items:
            type: string
        filename:
          type: string
        creator:
          type: string
        producer:
          type: string
        creationDate:
          type: string
        modificationDate:
          type: string
    VariableRuleEntryDto:
      type: object
      properties:
        variable:
          type: string
        enabled:
          type: boolean
        rules:
          type: array
          items:
            $ref: '#/components/schemas/VariableNormalizationRuleDto'
      required:
      - variable
      - enabled
      - rules
    TestSendDto:
      type: object
      properties:
        toEmail:
          type: string
          description: Recipient for sender="account". Omit for sender="platform" to use the tenant owner address.
        companyId:
          type: string
          description: Company used to resolve template variables
        contactId:
          type: string
          description: Contact used to resolve template variables
        leadId:
          type: string
          description: Lead used to resolve template variables
        accountId:
          type: string
          description: Connected email account used when sender="account"
        sender:
          type: string
          enum:
          - account
          - platform
          default: account
        sampleData:
          type: object
          description: Explicit variable values overriding company/contact/lead data
          additionalProperties:
            type: string
    AiGenerateCreativeDto:
      type: object
      properties:
        prompt:
          type: string
          description: Prompt describing the creative to generate
        tone:
          type: string
          description: Desired tone of voice, free text
        language:
          type: string
          description: Output language, e.g. "ru" or "en"
        type:
          type: string
          enum:
          - email
          - message
          description: Creative kind to generate
        provider:
          type: string
          description: AI provider override
        model:
          type: string
          description: AI model override
        temperature:
          type: number
          minimum: 0
          maximum: 2
        creativeId:
          type: string
          description: Existing creative to regenerate in place
      required:
      - prompt
    StartInboxPlacementTestDto:
      type: object
      properties:
        accountId:
          type: string
          description: 'Email account the seed letters are sent from. Required: seed reservation is paid, and the platform deliberately does not pick an account for you (#791).'
        providers:
          description: Seed providers to cover, e.g. ["gmail","outlook","yandex"]. Omit for the default set.
          type: array
          items:
            type: string
        companyId:
          type: string
          description: Company used to resolve merge variables while rendering the seed letter
        contactId:
          type: string
          description: Contact used to resolve merge variables while rendering the seed letter
        leadId:
          type: string
          description: Lead used to resolve merge variables while rendering the seed letter
      required:
      - accountId
    UpdateCreativeDto:
      type: object
      properties:
        autopilotConfig:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Autopilot configuration. aiVariables entries may carry requiredInputs and fallback.
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        subject:
          type:
          - string
          - 'null'
        bodyHtml:
          type:
          - string
          - 'null'
        bodyText:
          type:
          - string
          - 'null'
        messageText:
          type:
          - string
          - 'null'
        formConfig:
          type:
          - object
          - 'null'
        attachmentUrl:
          type:
          - string
          - 'null'
          maxLength: 2048
        attachmentName:
          type:
          - string
          - 'null'
          maxLength: 255
        attachmentCreativeId:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
        previewContactId:
          type:
          - string
          - 'null'
        previewCompanyId:
          type:
          - string
          - 'null'
        senderMethod:
          type: object
        subjectMethod:
          type: object
        bodyMethod:
          type: object
        aiPromptSubject:
          type:
          - object
          - 'null'
        aiPromptBody:
          type:
          - object
          - 'null'
        aiModel:
          type:
          - string
          - 'null'
        aiTemperature:
          type: number
        briefId:
          type:
          - string
          - 'null'
        includeDossier:
          type: boolean
        formCompanyName:
          type:
          - string
          - 'null'
        formContactName:
          type:
          - string
          - 'null'
        formEmail:
          type:
          - string
          - 'null'
        formPhone:
          type:
          - string
          - 'null'
        formTitle:
          type:
          - string
          - 'null'
        pixelTracking:
          type: boolean
        linkTracking:
          type: boolean
        unsubscribeLink:
          type: boolean
    VariableNormalizationRuleDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - regex_replace
          - truncate
          - default_if_empty
          - skip_if_equals
          - skip_if_matches
          - ai_normalize
        pattern:
          type: string
        replacement:
          type: string
        maxLength:
          type: number
        ellipsis:
          type: boolean
        defaultValue:
          type: string
        equalsVariable:
          type: string
        prompt:
          type: string
        model:
          type: string
        cacheKey:
          type: string
      required:
      - type
    CreateCreativeDto:
      type: object
      properties:
        type:
          type: string
          enum:
          - EMAIL
          - ATTACHMENT
          - VK
          - TELEGRAM
          - FORM
          - PHONE
          - WHATSAPP
          - LINKEDIN
          - AUTOPILOT
          - AUTOPILOT_V2
        autopilotConfig:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Autopilot configuration. aiVariables entries may carry requiredInputs and fallback.
        senderMethod:
          type: string
          enum:
          - NONE
          - SPINTAX
          - AI
        subjectMethod:
          type: string
          enum:
          - NONE
          - SPINTAX
          - AI
        bodyMethod:
          type: string
          enum:
          - NONE
          - SPINTAX
          - AI
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        subject:
          type:
          - string
          - 'null'
        bodyHtml:
          type:
          - string
          - 'null'
        bodyText:
          type:
          - string
          - 'null'
        messageText:
          type:
          - string
          - 'null'
        formConfig:
          type:
          - object
          - 'null'
        attachmentUrl:
          type:
          - string
          - 'null'
          maxLength: 2048
        attachmentName:
          type:
          - string
          - 'null'
          maxLength: 255
        attachmentCreativeId:
          type:
          - string
          - 'null'
        variables:
          type:
          - object
          - 'null'
        previewContactId:
          type:
          - string
          - 'null'
        previewCompanyId:
          type:
          - string
          - 'null'
        aiPromptSubject:
          type:
          - object
          - 'null'
        aiPromptBody:
          type:
          - object
          - 'null'
        aiModel:
          type:
          - string
          - 'null'
        aiTemperature:
          type: number
        briefId:
          type:
          - string
          - 'null'
        includeDossier:
          type: boolean
        formCompanyName:
          type:
          - string
          - 'null'
        formContactName:
          type:
          - string
          - 'null'
        formEmail:
          type:
          - string
          - 'null'
        formPhone:
          type:
          - string
          - 'null'
        formTitle:
          type:
          - string
          - 'null'
        pixelTracking:
          type: boolean
        linkTracking:
          type: boolean
        unsubscribeLink:
          type: boolean
      required:
      - type
      - name
    GeneratePdfDto:
      type: object
      properties:
        async:
          type: boolean
          description: Return a durable generation handle immediately and poll the PDF generation status endpoint.
          default: false
        sampleData:
          type: object
          additionalProperties:
            type: string
          description: Explicit variable values overriding resolved company/contact/lead data.
        companyId:
          type: string
        contactId:
          type: string
        leadId:
          type: string
        format:
          type: string
          enum:
          - A4
          - Letter
          default: A4
        landscape:
          type: boolean
          default: false
        pageNumbers:
          type: boolean
          description: Show page numbers in footer.
          default: false
        metadata:
          $ref: '#/components/schemas/GeneratePdfMetadataDto'
    SaveVariableRulesDto:
      type: object
      properties:
        variableRules:
          type: array
          items:
            $ref: '#/components/schemas/VariableRuleEntryDto'
      required:
      - variableRules
    PreviewCreativeDto:
      type: object
      properties:
        sampleData:
          type: object
          description: Sample values keyed by variable name, override for resolved contact/company/lead data
        seed:
          type: number
          description: Deterministic seed for spintax/variant resolution
        companyId:
          type: string
        contactId:
          type: string
        leadId:
          type: string
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
