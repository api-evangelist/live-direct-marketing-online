openapi: 3.2.0
info:
  title: inbox-check Self Control API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: SelfControl
paths:
  /api/admin/self-control:
    get:
      operationId: SelfControlController_history
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - SelfControl
      summary: Self control controller history
      x-summary-source: derived
  /api/admin/self-control/run:
    post:
      operationId: SelfControlController_run
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - SelfControl
      summary: Self control controller run
      x-summary-source: derived
components:
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
