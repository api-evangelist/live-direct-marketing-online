openapi: 3.2.0
info:
  title: inbox-check Presend Admin API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: PresendAdmin
paths:
  /api/admin/presend/stats:
    get:
      operationId: PresendAdminController_stats
      parameters:
      - name: days
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - PresendAdmin
      summary: Presend admin controller stats
      x-summary-source: derived
components:
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
