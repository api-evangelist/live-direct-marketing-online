openapi: 3.2.0
info:
  title: inbox-check Providers API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Providers
paths:
  /api/providers:
    get:
      operationId: ProvidersPublicController_list
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - Providers
      summary: Providers public controller list
      x-summary-source: derived
  /api/v1/providers:
    get:
      description: Lists all deliverability providers, marking which ones the calling key may use (with a reason for those it can’t) so clients can surface accurate upgrade prompts.
      operationId: V1ProvidersController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - apiKey: []
      summary: List available providers
      tags:
      - Providers
components:
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
