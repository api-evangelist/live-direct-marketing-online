      - jwt: []
      summary: Get the JSON Schema for an autopilot sub-resource
      tags:
      - Rules / Sub-resource
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/creatives/{id}/rules/{sub}/history:
    get:
      operationId: SubResourceRulesController_history
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: sub
        required: true
        in: path
        schema:
          type: string
      - name: limit
        required: true
        in: query
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
