tags:
- name: Rules / Sub-resource
paths:
  /api/creatives/{id}/rules-sub:
    get:
      operationId: SubResourceRulesController_listSubResources
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: List available autopilot sub-resource keys
      tags:
      - Rules / Sub-resource
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/creatives/{id}/rules/{sub}:
    get:
      operationId: SubResourceRulesController_get
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: sub
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get an autopilot sub-resource rules document
      tags:
      - Rules / Sub-resource
    patch:
      operationId: SubResourceRulesController_patch
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: sub
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Patch an autopilot sub-resource rules document
      tags:
      - Rules / Sub-resource
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/creatives/{id}/rules/{sub}/schema:
    get:
      operationId: SubResourceRulesController_getSchema
      parameters:
      - name: sub
        required: true
