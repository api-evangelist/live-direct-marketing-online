  /api/campaigns/{id}/sync-events:
    post:
      operationId: CampaignsController_syncEvents
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Sync open/click/bounce events from Dialog records back to recipients.
      tags:
      - Campaigns
  /api/campaigns/{id}/restore-infra-failed:
    post:
      description: 'Resets the circuit breaker (PAUSED → ACTIVE) AND, as a side effect, recovers unsent AI failures the same way retry-ai-failures with force does. The recovery result is in the aiRecovery field {reset, reason, effectiveProvider, model, failureReasons}: reset — how many rows returned to the pipeline, failureReasons — the reasons they failed for. So retry-ai-failures called right after resume normally returns reset=0 with reason=already_recovered — that is not an error.'
      operationId: CampaignsController_restoreInfraFailed
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreInfraFailedDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Resume a PAUSED campaign (reset circuit breaker) — also retries AI failures
      tags:
      - Campaigns
  /api/campaigns/{id}/resume:
    post:
      operationId: CampaignsController_resume
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      tags:
      - Campaigns
      summary: Campaigns controller resume
      x-summary-source: derived
  /api/campaigns/{id}/pause:
    post:
      description: 'Stops sending (ACTIVE → PAUSED) with the same attribution as /resume: a PAUSED event in the campaign feed with actor{who,reason}. Unlike /resume this is NOT a timer — auto-resume will not happen, work can only be resumed by another /resume or PATCH {status:"ACTIVE"}. An optional body.reason goes into the feed event. From a status other than ACTIVE — 409 invalid_status_transition. PATCH /campaigns/:id {status:"PAUSED"} keeps working as before (compatibility) — this endpoint does not replace it, it closes an asymmetry: the start/stop pair had no named endpoint for stopping, unlike resume.'
      operationId: CampaignsController_pause
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseCampaignDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Pause an ACTIVE campaign (symmetric to /resume)
      tags:
      - Campaigns
  /api/campaigns/{id}/recipients/{rid}:
    get:
      operationId: CampaignsController_getRecipient
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: rid
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get a recipient with its event log.
      tags:
      - Campaigns
components:
  schemas:
    RepairUnsubscribeDto:
      type: object
      properties:
        recipientIds:
          type: array
          items:
            type: string
        stages:
          type: array
          items:
            type: string
    CampaignPreparationConfigDto:
      type: object
      properties:
        maxInFlight:
          type: number
          description: Maximum unique unsent touches across preparation, audit and delivery. Not a batch size.
          minimum: 1
          maximum: 50
          default: 50
        maxPendingPlacement:
          type: number
          description: Maximum sent touches awaiting placement feedback before new preparation pauses.
          minimum: 1
          maximum: 50
          default: 50
    CreateTestTaskDto:
      type: object
      properties:
        requestKey:
          type: string
          maxLength: 200
          description: Stable retry key; Idempotency-Key header takes precedence when present
        intendedRecipientId:
          type: string
          maxLength: 128
          description: Existing CampaignRecipient id from this DRAFT campaign
    SubmitRenderedContentDto:
      type: object
      properties:
        items:
          description: batch <=100, bodyHtml <=256KB
          type: array
          items:
            $ref: '#/components/schemas/SubmitRenderedContentItemDto'
      required:
      - items
    UpdateCampaignDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          - DONE
          - ERROR
        sourceType:
          type: string
          enum:
          - API
          - LIST
          - CRM_TRIGGER
        sourceConfig:
          type: object
        creativeIds:
          type: array
          items:
            type: string
        creativeRouting:
          type: object
        briefId:
          type:
          - object
          - 'null'
        authorConfig:
          type: object
        auditorConfig:
          type: object
        senderConfig:
          description: Partial sender config. Changing dispatch→send atomically unpins sender/From only for READY rows and preserves scheduledAt; SENDING/SENT/outbox are never rewritten.
          allOf:
          - $ref: '#/components/schemas/CampaignSenderConfigDto'
        sendWindow:
          description: Partial campaign-owned send-window patch. Omitted fields are preserved; null is rejected. enabled:false is explicit 24/7.
          allOf:
          - $ref: '#/components/schemas/CampaignSendWindowDto'
        canvas:
          type: object
        groupId:
          type:
          - object
          - 'null'
        renderMode:
          type: string
          enum:
          - PLATFORM
          - BYOC
        acknowledgeUngroundedAudience:
          type: boolean
          description: Explicit acknowledgement for a high ungrounded-audience ratio.
    RestoreInfraFailedDto:
      type: object
      properties:
        dryRun:
          type: boolean
          description: По умолчанию true — только показать, кого вернёт (#765)
    CampaignSenderConfigDto:
      type: object
      properties:
        deliveryMode:
          type: string
          enum:
          - SMTP
          - RPA
          - MIX
          description: 'RPA is strict: it never falls back to SMTP. MIX uses the selected eligible relay method.'
        senderAssignment:
          type: string
          description: When to bind a sender. send (default) selects an eligible account at send time with failover; dispatch is an explicit legacy opt-in that pins READY rows in advance.
          enum:
          - send
          - dispatch
          default: send
        preparation:
          $ref: '#/components/schemas/CampaignPreparationConfigDto'
        pacing:
          $ref: '#/components/schemas/CampaignPacingConfigDto'
    MoveRecipientsStageFilterDto:
      type: object
      properties:
        stage:
          type: string
        search:
          type: string
        canvasStage:
          type: string
        finalStatus:
          type: string
        emailValid:
          type: string
        auditLevel:
          type: string
        inboxPlacement:
          type: string
        sentFrom:
          type: string
        sentTo:
          type: string
    CampaignPacingConfigDto:
      type: object
      properties:
        dailyTarget:
          type: number
          minimum: 1
          maximum: 1000000
          description: Maximum unique REAL campaign recipients admitted in the campaign calendar day.
        bestTimeMode:
          type: string
          enum:
          - advisory
          default: advisory
          description: best_send_time is a recommendation; the send point may ignore it to meet the daily target.
    CampaignPreparationRequestDto:
      type: object
      properties:
        limit:
          type: number
          minimum: 1
          maximum: 50
          description: Requested preparation batch, bounded by remaining preparation and relay capacity.
          default: 50
    PourFromLeadsDto:
      type: object
      properties:
        pipelineId:
          type: string
        stageId:
          type: string
        interestStatus:
          type: string
        limit:
          type: number
    SubmitRenderedContentItemDto:
      type: object
      properties:
        recipientId:
          type: string
        subject:
          type: string
        bodyHtml:
          type: string
        bodyText:
          type: string
      required:
      - recipientId
      - subject
    PauseCampaignDto:
      type: object
      properties:
        reason:
          type: string
          description: Идёт в событие PAUSED в ленте кампании (#514)
    PushAttachmentDto:
      type: object
      properties:
        filename:
          type: string
        contentBase64:
          type: string
        contentType:
          type: string
    CreateCampaignDto:
      type: object
      properties:
        name:
          type: string
          description: Campaign name
        description:
          type: string
          description: Campaign description
        sourceType:
          type: string
          description: Source type
          enum:
          - API
          - LIST
          - CRM_TRIGGER
        sourceConfig:
          type: object
          description: Source configuration
        creativeIds:
          description: Creative ids
          type: array
          items:
            type: string
        creativeRouting:
          type: object
          description: Creative routing
        briefId:
          type: string
          description: Brief id
        authorConfig:
          type: object
          description: Author config
        auditorConfig:
          type: object
          description: Auditor config
        senderConfig:
          description: Sender config. senderAssignment defaults to send for new campaigns; dispatch must be selected explicitly.
          allOf:
          - $ref: '#/components/schemas/CampaignSenderConfigDto'
        sendWindow:
          description: Campaign-owned send window. Omitted fields use the safe initial default; explicit enabled:false means 24/7.
          allOf:
          - $ref: '#/components/schemas/CampaignSendWindowDto'
        canvas:
          type: object
          description: Canvas config
        renderMode:
          type: string
          description: Render mode
          enum:
          - PLATFORM
          - BYOC
      required:
      - name
    CampaignSendWindowDto:
      type: object
      properties:
        enabled:
          type: boolean
          description: true = bounded calendar window; false = explicit 24/7
        workDays:
          description: 'ISO weekdays: 1 Monday … 7 Sunday'
          type: array
          items:
            type: number
            maximum: 7
            minimum: 1
        startTime:
          type: string
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d
          description: Local start time, HH:MM
        endTime:
          type: string
          pattern: ^(?:[01]\d|2[0-3]):[0-5]\d
          description: Local end time, HH:MM (exclusive)
        timezone:
          type: string
          description: IANA timezone, for example Europe/Moscow
    MoveRecipientsStageDto:
      type: object
      properties:
        toStage:
          type: string
          description: 'Целевая стадия канваса: STEP:n | WAIT:n | COMPLETED | STOPPED | __none__'
        recipientIds:
          type: array
          items:
            type: string
        filter:
          $ref: '#/components/schemas/MoveRecipientsStageFilterDto'
      required:
      - toStage
    PushContactsDto:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/PushRowDto'
      required:
      - rows
    RerenderRecipientsDto:
      type: object
      properties:
        recipientIds:
          type: array
          items:
            type: string
        stages:
          type: array
          items:
            type: string
        force:
          type: boolean
          description: '#531: явный грант нового окна платных аудит-попыток'
    PushRowDto:
      type: object
      properties:
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        contactId:
          type: string
        companyId:
          type: string
        leadId:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PushAttachmentDto'
    PourCampaignDto:
      type: object
      properties:
        listId:
          type: string
          description: Contact-list id; required unless allContacts:true (#565)
        allContacts:
          type: boolean
          description: Pour to all contacts
        companyListId:
          type: string
          description: '#1221: Company-list id — pour live contacts of ALL companies in this COMPANY list (not a contact list). Mutually exclusive with listId/allContacts.'
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
