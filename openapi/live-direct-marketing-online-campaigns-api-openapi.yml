        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Read a tenant-bound preparation operation.
      tags:
      - Campaigns
  /api/campaigns/{id}/prepare:
    post:
      operationId: CampaignsController_prepare
