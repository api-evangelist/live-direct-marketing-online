openapi: 3.2.0
info:
  title: inbox-check Beta Signups API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: beta-signups
paths:
  /api/beta-signups:
    post:
      operationId: BetaSignupsController_submit
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBetaDto'
      responses:
        '201':
          description: ''
      tags:
      - beta-signups
      summary: Beta signups controller submit
      x-summary-source: derived
components:
  schemas:
    SubmitBetaDto:
      type: object
      properties: {}
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
