  /api/tasks/{id}/stop:
    post:
      operationId: TasksController_stop
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Stop a task (mark as DONE)
      tags:
      - Tasks
  /api/tasks/{id}/restart:
    post:
      operationId: TasksController_restart
      parameters:
      - name: id
