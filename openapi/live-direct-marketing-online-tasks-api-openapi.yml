  /api/tasks/{id}/start:
    post:
      operationId: TasksController_start
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTaskDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Start (or resume) a task.
      tags:
