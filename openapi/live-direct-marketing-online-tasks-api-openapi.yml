components:
  schemas:
    CreateTaskDto:
      type: object
      properties:
        methodId:
          type: number
          description: Method id — e.g. 22=scoring (lead gen), 11=email validation, 14=ICP review, 15=DIG, 12=mailing (legacy, use /campaigns instead)
        methodName:
          type: string
          description: Human-readable label mirroring methodId, e.g. "scoring"
        description:
          type: string
        config:
          type: object
          description: Method-specific configuration payload (shape depends on methodId)
        mailingConfig:
          type: object
          description: Mailing configuration patch (methodId=12, legacy)
        contactListId:
          type: string
          description: Contact list to source items from at POST /tasks/:id/start
        contactListIdFinish:
          type: string
          description: Contact list to move finished items into
        accountListId:
          type: string
        creativeId:
          type: string
        creativeIds:
          type: array
          items:
            type: string
        companyListId:
          type: string
          description: 'CompanyList id — for methodId=22 (scoring): items are populated from this list at POST /tasks/:id/start; must reference an existing list'
        resumeAt:
          type: string
          description: ISO date string — task waits (does not run) until this moment
        streamCount:
          type: number
          description: Parallel stream count, clamped to the tenant maxStreams setting
      required:
      - methodId
      - methodName
    UpdateTaskMemoryDto:
      type: object
      properties:
        memory:
          type: string
      required:
      - memory
    UpdateTaskDto:
      type: object
      properties:
        description:
          type: string
        config:
          type: object
          description: Task configuration; shape depends on methodId
        mailingConfig:
          type: object
        contactListId:
          type: string
        contactListIdFinish:
          type: string
        accountListId:
          type: string
        creativeId:
          type: string
        creativeIds:
          type: array
          items:
            type: string
        companyListId:
          type: string
        resumeAt:
          type: string
          description: ISO time of resumption
        streamCount:
          type: number
    ReorderStepsDto:
      type: object
      properties:
        stepIds:
          description: Step identifiers in the desired execution order
          type: array
          items:
            type: string
      required:
      - stepIds
    AddPipelineStepDto:
      type: object
      properties:
        type:
          type: string
          description: 'Pipeline step type: SITE_AVAILABILITY, AI_CONTENT, KEYWORDS, EMAIL_EXTRACT, PHONE_EXTRACT, SOCIAL_LINKS, TECH_DETECT, GEO_FILTER, NALOG_LOOKUP, AI_CARD_FIELD, etc.'
        enabled:
          type: boolean
          description: Step is active (defaults to true)
        name:
          type: string
          description: Human-readable step name (defaults to type)
        config:
          type: object
          description: Step configuration (shape depends on type)
        onSuccess:
          type: string
          description: 'Routing on success: CONTINUE|STOP|MOVE_TO_LIST|DELETE'
        onSuccessTarget:
          type: string
          description: Target for onSuccess=MOVE_TO_LIST (list id)
        onFail:
          type: string
          description: 'Routing on failure: CONTINUE|STOP|MOVE_TO_LIST|DELETE'
        onFailTarget:
          type: string
          description: Target for onFail=MOVE_TO_LIST (list id)
        onError:
          type: string
          description: 'Routing on error: CONTINUE|STOP|MOVE_TO_LIST|DELETE'
        onErrorTarget:
          type: string
          description: Target for onError=MOVE_TO_LIST (list id)
      required:
      - type
    UpdatePipelineStepDto:
      type: object
      properties:
        type:
          type: string
          description: ScoringStepType value
        enabled:
          type: boolean
        name:
          type: string
        config:
          type: object
          description: Step configuration; shape depends on type
        onSuccess:
          type: string
          description: CONTINUE | STOP | MOVE_TO_LIST | DELETE
        onSuccessTarget:
          type: string
        onFail:
          type: string
          description: CONTINUE | STOP | MOVE_TO_LIST | DELETE
        onFailTarget:
          type: string
        onError:
          type: string
          description: CONTINUE | STOP | MOVE_TO_LIST | DELETE
        onErrorTarget:
          type: string
    StartTaskDto:
      type: object
      properties:
        limit:
          type: number
          minimum: 1
          description: 'Trial run: process no more than N items and pause the task. The limit is ONE-TIME — the next start without the parameter runs the rest to completion.'
          maximum: 1000
          example: 100
    UpdateCronSettingsDto:
      type: object
      properties:
        cronEnabled:
          type: boolean
        cronInterval:
          type: number
          minimum: 1
          description: Cron interval, minutes
        batchSize:
          type: number
          minimum: 1
          description: Batch size; the service clamps it to the allowed range
        rateLimit:
          type: number
          minimum: 1
        scoringMode:
          type: string
    RetryScoringResultsDto:
      type: object
      properties:
        reasonCodes:
          type: array
          minItems: 1
          description: AND filter shared by preview and retry. Without statuses, selects technical failures only; UNAVAILABLE still requires includeUnavailable. An empty array is rejected.
          items:
            type: string
            enum:
            - dns_fail
            - tls_fail
            - conn_refused
            - timeout
            - http_4xx
            - http_5xx
            - redirect_loop
            - empty_content
            - no_material
            - ai_no_response
            - ai_parse_fail
            - batch_parse_fail
            - verdict_negative
            - verdict_contradictory
            - internal_error
            - stub_page
            - unclassified
        statuses:
          type: array
          description: ScoringResult statuses to retry. Defaults to ERROR only (the old behavior). UNAVAILABLE (dead domain) is excluded from this list by the service even if specified here — see includeUnavailable. STUB_MATERIAL (#1146) — the material was a JS stub/error page/parking page; a retry makes sense if the site material is expected to have changed.
          items:
            type: string
            enum:
            - ERROR
            - UNAVAILABLE
            - NO_WWW
            - SCORED_BELOW_THRESHOLD
            - SKIPPED
            - STUB_MATERIAL
        includeUnavailable:
          type: boolean
          description: 'Explicit confirmation: include UNAVAILABLE (dead domains) in the retry, despite the crawl usually being useless and paid. Without this flag the service silently drops UNAVAILABLE from statuses.'
        processedAfter:
          type: string
          description: Only results with processedAt >= this ISO time
        processedBefore:
          type: string
          description: Only results with processedAt <= this ISO time
        resultIds:
          description: 'Targeted retry: ids of specific ScoringResult rows (not status/window). Combined with companyIds via OR; records not belonging to this task are silently ignored.'
          type: array
          items:
            type: string
        companyIds:
          description: 'Targeted retry: companyId of the cards (alternative to resultIds, combined with it via OR).'
          type: array
          items:
            type: string
        includeActive:
          type: boolean
          description: 'Explicit confirmation: include ACTIVE records (an already-accepted verdict) in the targeted retry over resultIds/companyIds, despite this erasing the card''s honest verdict. Without the flag the service silently skips ACTIVE entries from the list. Applies ONLY together with resultIds/companyIds — does not affect statuses (ACTIVE remains unreachable there by any means, see @IsIn above).'
        preview:
          type: boolean
          description: 'Read-only preview: return how many rows (and, if cheap, which ids) this same call would select, without running the retry or changing ScoringResult/TaskItem. The journal (active_reset_by_retry) is not written when preview=true.'
        contradictoryOnly:
          type: boolean
          description: Narrow the selection to results where the contradiction flag fired at any step (data.contradictoryFields — a non-empty array). Combined with the other selection conditions (statuses/processedAfter/processedBefore/resultIds/companyIds, includeActive/includeUnavailable) as an additional narrowing (AND), not a replacement for them.
    EnrollInBranchDto:
      type: object
      properties:
        contactIds:
          type: array
          items:
            type: string
      required:
      - contactIds
    UpdateAiSettingsDto:
      type: object
      properties:
        provider:
          type:
          - object
          - 'null'
          description: 'Provider: hydraai | aitunnel | claude | ldmai'
        models:
          type: object
          description: 'Model per call kind, e.g. { scoring: "..." }'
          additionalProperties:
            type: string
    CreateBranchDto:
      type: object
      properties:
        methodId:
          type: number
          description: Sub-branch method (11 email validation, 14 ICP review, 15 DIG, 22 scoring)
        methodName:
          type: string
        description:
          type: string
        branchTrigger:
          type: object
          description: 'Branch entry condition: { event, condition? }'
        mailingConfig:
          type: object
        contactListId:
          type: string
        creativeId:
          type: string
        accountListId:
          type: string
      required:
      - methodId
      - methodName
      - branchTrigger
    UpdateErrorSettingsDto:
      type: object
      properties:
        reasonClasses:
          type: array
          minItems: 1
          description: 'Scoring failure classes counted by the configured pause thresholds. Default: platform. Network/material remain visible even when not selected.'
          items:
            type: string
            enum:
            - platform
            - network
            - material
        consecutiveErrorLimit:
          type: number
          minimum: 1
          description: N consecutive errors → auto-pause
        errorRatePercent:
          type: number
          description: Error rate within the window, %
        errorRateWindowMin:
          type: number
          minimum: 1
          description: Observation window, minutes
        errorRateMinItems:
          type: number
          minimum: 1
          description: Minimum items before checking the rate
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
