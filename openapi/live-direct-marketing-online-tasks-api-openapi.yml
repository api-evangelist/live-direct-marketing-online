          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Reset a tripped circuit breaker for a task
      tags:
      - Tasks
  /api/tasks/{id}/steps:
