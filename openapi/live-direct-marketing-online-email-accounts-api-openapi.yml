components:
  schemas:
    ImportOauthDto:
      type: object
      properties:
        combo:
          type: string
        email:
          type: string
        password:
          type: string
        refreshToken:
          type: string
        clientId:
          type: string
        listId:
          type: string
    ImportOauthBulkDto:
      type: object
      properties:
        combos:
          type: array
          items:
            type: string
        listId:
          type: string
      required:
      - combos
    CreateEmailAccountDto:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        displayName:
          type: string
        signature:
          type: string
        notes:
          type: string
        smtpHost:
          type: string
        smtpPort:
          type: number
          minimum: 1
