openapi: 3.2.0
info:
  title: LDM v3 Dialog Linker API
  description: 'Multi-tenant B2B outreach automation platform. Auth: JWT Bearer (15-min) or tenant API key (ldm_*) managed in CRM Settings → API Keys. All tenant-scoped endpoints require the X-Tenant-Id header.'
  version: 1.0.0
  contact: {}
servers:
- url: https://api.live-direct-marketing.online
  description: Production
- url: https://api.dev.live-direct-marketing.online
  description: Development
- url: http://127.0.0.1:3000
  description: Local
tags:
- name: Dialog Linker
paths:
  /api/dialog-linker/relink/{dialogId}:
    post:
      operationId: DialogLinkerController_relink
      parameters:
      - name: dialogId
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Manually re-run linker for a specific dialog
      tags:
      - Dialog Linker
  /api/dialog-linker/backfill:
    post:
      operationId: DialogLinkerController_backfill
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Run dialog linker backfill across the tenant (admin)
      tags:
      - Dialog Linker
      x-required-scope:
      - linker:write
  /api/dialog-linker/stats:
    get:
      operationId: DialogLinkerController_getStats
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get linker statistics by status
      tags:
      - Dialog Linker
      x-required-scope:
      - linker:read
  /api/dialog-linker/failure-summary:
    get:
      operationId: DialogLinkerController_getFailureSummary
      parameters:
      - name: limit
        required: true
        in: query
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get failed linker reason counts and LinkLog coverage
      tags:
      - Dialog Linker
      x-required-scope:
      - linker:read
  /api/dialog-linker/logs/{dialogId}:
    get:
      operationId: DialogLinkerController_getLogs
      parameters:
      - name: dialogId
        required: true
        in: path
        schema:
          type: string
      - name: page
        required: true
        in: query
        schema:
          type: string
      - name: limit
        required: true
        in: query
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get linker logs for a specific dialog
      tags:
      - Dialog Linker
  /api/dialog-linker/logs:
    get:
      operationId: DialogLinkerController_getAllLogs
      parameters:
      - name: page
        required: true
        in: query
        schema:
          type: string
      - name: limit
        required: true
        in: query
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get all linker logs (admin tech log)
      tags:
      - Dialog Linker
      x-required-scope:
      - linker:read
components:
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
