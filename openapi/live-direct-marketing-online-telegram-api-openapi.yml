openapi: 3.2.0
info:
  title: inbox-check Telegram API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: telegram
paths:
  /api/telegram/webhook:
    post:
      operationId: TelegramController_webhook
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - telegram
      summary: Telegram controller webhook
      x-summary-source: derived
  /api/telegram/login-link:
    get:
      operationId: TelegramController_loginLink
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - telegram
      summary: Telegram controller login link
      x-summary-source: derived
  /api/telegram/link-token:
    post:
      operationId: TelegramController_linkToken
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - telegram
      summary: Telegram controller link token
      x-summary-source: derived
components:
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
