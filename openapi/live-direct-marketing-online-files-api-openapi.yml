        '200':
          description: ''
      security:
      - jwt: []
      summary: List uploaded creative images for the tenant
      tags:
      - Files
      x-required-scope:
      - files:read
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/files/images/{filename}:
    delete:
      operationId: FilesController_deleteImage
      parameters:
      - name: filename
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Delete a tenant-scoped creative image
      tags:
      - Files
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/files/assets:
    post:
      operationId: FilesController_uploadAsset
      parameters:
      - name: X-Tenant-Id
