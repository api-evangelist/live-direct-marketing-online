openapi: 3.2.0
info:
  title: inbox-check Screenshots API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Screenshots
paths:
  /api/screenshot-orders:
    post:
      operationId: ScreenshotOrdersController_track
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackDto'
      responses:
        '201':
          description: ''
      tags:
      - Screenshots
      summary: Screenshot orders controller track
      x-summary-source: derived
components:
  schemas:
    TrackDto:
      type: object
      properties: {}
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
