components:
  schemas:
    RpaGrantDto:
      type: object
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        userId:
          type: string
          minLength: 1
          maxLength: 128
        enabled:
          type: boolean
      required:
      - tenantId
      - userId
      - enabled
    RpaTraceDto:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    RpaGlobalAccessDto:
      type: object
      properties:
        enabled:
          type: boolean
      required:
      - enabled
    RpaCreateKeyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - name
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
