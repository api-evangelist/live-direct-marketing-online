  /api/admin/rpa/protocol:
    get:
      operationId: RpaAdminController_protocol
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
