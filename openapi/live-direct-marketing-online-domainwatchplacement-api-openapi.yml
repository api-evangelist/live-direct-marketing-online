openapi: 3.2.0
info:
  title: inbox-check Domain Watch Placement API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: DomainWatchPlacement
paths:
  /api/domain-watch/placement:
    get:
      operationId: DomainWatchPlacementController_get
      parameters:
      - name: token
        required: true
        in: query
        schema:
          type: string
      - name: id
        required: true
        in: query
        schema:
          type: string
      - name: test
        required: true
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - DomainWatchPlacement
      summary: Domain watch placement controller get
      x-summary-source: derived
    post:
      operationId: DomainWatchPlacementController_start
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementDto'
      responses:
        '201':
          description: ''
      tags:
      - DomainWatchPlacement
      summary: Domain watch placement controller start
      x-summary-source: derived
components:
  schemas:
    PlacementDto:
      type: object
      properties: {}
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
