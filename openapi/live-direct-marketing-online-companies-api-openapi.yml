    - url: http://127.0.0.1:3000
      description: Local
components:
  schemas:
    CreateCompanyDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        domain:
          type: string
        industry:
          type: string
        size:
          type: object
        country:
          type: string
        city:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
        description:
          type: string
        source:
          type: string
        taxId:
          type: string
          maxLength: 20
        status:
          type: object
        importBatchId:
          type: string
      required:
      - name
    CompaniesImportCombinedDto:
      type: object
      properties:
        rows:
          description: Raw rows parsed from the source file/sheet
          type: array
          items:
            type: object
        mapping:
          type: object
          description: Column -> field mapping. Company fields (name, domain, inn, industry, size, country, city, address, state, phone, website, source), custom cf:<key>, contact c:firstName/c:lastName/c:email/c:phone/c:position/c:personalEmail/c:linkedin
        options:
          type: object
          description: dedupeBy, genericContactName, listId — see POST /companies/import/combined summary
      required:
      - rows
      - mapping
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        domain:
          type: string
        industry:
          type: string
        size:
          type: object
        country:
          type: string
        city:
          type: string
        address:
          type: string
        phone:
          type: string
        website:
          type: string
        description:
          type: string
        source:
          type: string
        taxId:
          type: string
          maxLength: 20
        status:
          type: object
        importBatchId:
          type: string
        state:
          type: string
        linkedin:
          type: string
        foundedYear:
          type: string
          pattern: /^\d{4}$/
        catalogInn:
          type: string
          maxLength: 12
        logo:
          type: string
    CompaniesImportStartDto:
      type: object
      properties:
        rows:
          description: Raw rows parsed from the source file/sheet
          type: array
          items:
            type: object
        mapping:
          type: object
          description: Column -> field mapping (csvColumn -> target field)
        options:
          type: object
          description: 'dedupeBy: "auto"|"inn"|"domain" (default auto); duplicateHandling: "skip"|"update"|"enrich"|"create" (default skip). "enrich" (#1057) fills only EMPTY fields of the matched duplicate from the file, never overwrites non-empty ones; customFields merge by the same rule (canon mergeCustomFields). listId (#1057): every row that matched a card — created, updated, OR a found duplicate (skip/enrich) — is added to this list; must be an existing list id in this tenant.'
      required:
      - rows
      - mapping
    MergeCompaniesDto:
      type: object
      properties:
        keepId:
          type: string
          description: Id of the company record to keep
        mergeIds:
          description: Ids of the companies to merge into keepId and delete
          type: array
          items:
            type: string
      required:
      - keepId
      - mergeIds
    CompaniesBulkDto:
      type: object
      properties:
        action:
          type: string
          description: Bulk action name (e.g. delete, addTags, removeTags, setField, addToList)
        companyIds:
          description: Company ids to act on
          type: array
          items:
            type: string
        ids:
          description: Alias for companyIds
          type: array
          items:
            type: string
        tagIds:
          description: Tag ids for addTags/removeTags actions
          type: array
          items:
            type: string
        listId:
          type: string
          description: Target list id for addToList action
        fieldName:
          type: string
          description: Field name for a setField-style action
        fieldValue:
          type: object
          description: Field value for a setField-style action (shape depends on fieldName)
      required:
      - action
    CompaniesImportPreviewDto:
      type: object
      properties:
        rows:
          description: Raw rows parsed from the source file/sheet
          type: array
          items:
            type: object
        mapping:
