            schema:
              $ref: '#/components/schemas/ImportFromGoogleSheetsDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Fetch rows from a Google Sheets URL for import.
      tags:
      - Companies
      x-required-scope:
      - crm:write
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/companies/import/preview:
    post:
      operationId: CompaniesController_importPreview
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompaniesImportPreviewDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Preview a companies import with proposed mapping
      tags:
      - Companies
      x-required-scope:
      - crm:write
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/companies/import/start:
    post:
      operationId: CompaniesController_importStart
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompaniesImportStartDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Start a companies import.
      tags:
      - Companies
      x-required-scope:
      - crm:write
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/companies/import/combined:
    post:
      operationId: CompaniesController_importCombined
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
