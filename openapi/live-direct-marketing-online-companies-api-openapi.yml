        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompaniesImportCombinedDto'
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Combined companies + contacts import.
      tags:
