        '200':
          description: ''
      security:
      - jwt: []
      summary: Get a template with steps and runs
      tags:
      - Project Templates
    patch:
      operationId: ProjectTemplatesController_update
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateDto'
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Update a template (name, description, isArchived)
      tags:
      - Project Templates
    delete:
      operationId: ProjectTemplatesController_remove
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Delete a template (409 if it has runs — archive instead)
      tags:
      - Project Templates
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/project-templates/{id}/steps:
    post:
      operationId: ProjectTemplatesController_addStep
      parameters:
      - name: id
