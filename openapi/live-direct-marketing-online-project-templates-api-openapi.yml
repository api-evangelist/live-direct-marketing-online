openapi: 3.2.0
info:
  title: Live Direct Marketing Online Project Templates API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged Project Templates across 2 of this provider''s published API definitions: live-direct-marketing-online-ldm-v3-openapi.json, live-direct-marketing-online-ldm-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.live-direct-marketing.online
  description: Production
- url: https://api.dev.live-direct-marketing.online
  description: Development
- url: http://127.0.0.1:3000
  description: Local
tags:
- name: Project Templates
paths:
  /api/project-templates/runs/{runId}:
    get:
      operationId: ProjectTemplatesController_findRun
      parameters:
      - name: runId
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get a project run with steps and totals
      tags:
      - Project Templates
    patch:
      operationId: ProjectTemplatesController_updateRun
      parameters:
      - name: runId
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRunDto'
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Update a project run (name, status, isTest, notes)
      tags:
      - Project Templates
    delete:
      operationId: ProjectTemplatesController_removeRun
      parameters:
      - name: runId
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Delete a project run
      tags:
      - Project Templates
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/project-templates/runs/{runId}/steps/{stepId}:
    patch:
      operationId: ProjectTemplatesController_updateRunStep
      parameters:
      - name: runId
        required: true
        in: path
        schema:
          type: string
      - name: stepId
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
