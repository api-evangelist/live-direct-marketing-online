components:
  schemas:
    UpdateRunStepDto:
      type: object
      properties: {}
    UpdateRunDto:
      type: object
      properties: {}
    StepDto:
      type: object
      properties: {}
    CreateRunDto:
      type: object
      properties: {}
    CreateTemplateDto:
      type: object
      properties: {}
    UpdateTemplateDto:
      type: object
      properties: {}
    ReorderDto:
      type: object
      properties: {}
    UpdateStepDto:
      type: object
      properties: {}
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
