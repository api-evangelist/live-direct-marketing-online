info:
  title: Live Direct Marketing Online Companies / Duplicates API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged Companies / Duplicates across 2 of this provider''s published API definitions: live-direct-marketing-online-ldm-v3-openapi.json, live-direct-marketing-online-ldm-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.live-direct-marketing.online
  description: Production
- url: https://api.dev.live-direct-marketing.online
  description: Development
- url: http://127.0.0.1:3000
  description: Local
tags:
- name: Companies / Duplicates
paths:
  /api/companies/duplicates/fields:
    get:
      operationId: DuplicatesController_getFields
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: List fields available for duplicate-scan matching
      tags:
      - Companies / Duplicates
      x-required-scope:
      - crm:read
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/companies/duplicates/scan:
    post:
      operationId: DuplicatesController_scan
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '201':
          description: ''
      security:
      - jwt: []
      summary: Scan companies for duplicates by configured fields
      tags:
      - Companies / Duplicates
      x-required-scope:
      - crm:read
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
