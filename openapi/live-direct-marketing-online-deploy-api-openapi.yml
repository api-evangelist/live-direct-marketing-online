openapi: 3.2.0
info:
  title: inbox-check Deploy API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Deploy
paths:
  /api/admin/deploy:
    post:
      operationId: DeployController_enqueue
      parameters: []
      responses:
        '201':
          description: ''
      security:
      - adminKey: []
      tags:
      - Deploy
      summary: Deploy controller enqueue
      x-summary-source: derived
    get:
      operationId: DeployController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - adminKey: []
      tags:
      - Deploy
      summary: Deploy controller list
      x-summary-source: derived
  /api/admin/deploy/{jobId}:
    get:
      operationId: DeployController_status
      parameters:
      - name: jobId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      security:
      - adminKey: []
      tags:
      - Deploy
      summary: Deploy controller status
      x-summary-source: derived
components:
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
