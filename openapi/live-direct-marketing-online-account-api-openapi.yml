openapi: 3.2.0
info:
  title: inbox-check Account API
  description: Email deliverability test API for AI agents and automation. Same surface is exposed via REST (here), MCP (streamable-http at /mcp), and A2A (skill manifest at /.well-known/agent.json).
  version: 1.0.0
  contact: {}
servers: []
tags:
- name: Account
paths:
  /api/v1/me:
    get:
      description: Returns this key's tier, scopes, allowed providers, and daily/monthly usage counters. Useful for self-checking remaining quota before a batch.
      operationId: V1MeController_me
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - apiKey: []
      summary: Caller introspection — key metadata + current period usage
      tags:
      - Account
  /api/account/api-keys:
    get:
      operationId: AccountController_list
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - cookie: []
      tags:
      - Account
      summary: Account controller list
      x-summary-source: derived
    post:
      operationId: AccountController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountKeyDto'
      responses:
        '201':
          description: ''
      security:
      - cookie: []
      tags:
      - Account
      summary: Account controller create
      x-summary-source: derived
  /api/account/dashboard:
    get:
      operationId: AccountController_dashboard
      parameters: []
      responses:
        '200':
          description: ''
      security:
      - cookie: []
      summary: 'W1b — portal dashboard: usage chart + recent tests + provider mix'
      tags:
      - Account
  /api/account/api-keys/{id}:
    delete:
      operationId: AccountController_revoke
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      security:
      - cookie: []
      tags:
      - Account
      summary: Account controller revoke
      x-summary-source: derived
components:
  schemas:
    CreateAccountKeyDto:
      type: object
      properties:
        monitoringWrite:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 60
  securitySchemes:
    apiKey:
      scheme: bearer
      bearerFormat: icp_live_*
      type: http
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key
