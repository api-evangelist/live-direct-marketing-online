openapi: 3.2.0
info:
  title: Live Direct Marketing Online Dialogs API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged Dialogs across 2 of this provider''s published API definitions: live-direct-marketing-online-ldm-v3-openapi.json, live-direct-marketing-online-ldm-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.live-direct-marketing.online
  description: Production
- url: https://api.dev.live-direct-marketing.online
  description: Development
- url: http://127.0.0.1:3000
  description: Local
tags:
- name: Dialogs
paths:
  /api/dialogs:
    get:
      operationId: DialogsController_findAll
      parameters:
      - name: page
        required: false
        in: query
        description: 1-based page number
        schema:
          example: 1
          type: number
      - name: pageSize
        required: false
        in: query
        description: Items per page
        schema:
          example: 25
          type: number
      - name: channel
        required: false
        in: query
        description: Filter by channel (EMAIL/TELEGRAM/...)
        schema:
          type: string
      - name: status
        required: false
        in: query
        description: Filter by dialog status
        schema:
          type: string
      - name: direction
        required: false
        in: query
        description: IN / OUT
        schema:
          type: string
      - name: contactId
        required: false
        in: query
        description: Filter to dialogs linked to a contact
        schema:
          type: string
      - name: companyId
        required: false
        in: query
        description: Filter to dialogs linked to a company
        schema:
          type: string
      - name: leadId
        required: false
        in: query
        description: Filter to dialogs linked to a lead
        schema:
          type: string
      - name: accountId
        required: false
        in: query
        description: Filter to dialogs on a single email account
        schema:
          type: string
      - name: mailingId
        required: false
        in: query
        description: Filter to dialogs from a single mailing
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: Full-text search across subject/body
        schema:
          type: string
      - name: needsAttention
        required: false
        in: query
        description: true/false — only items flagged for review
        schema:
          type: string
      - name: dateFrom
        required: false
        in: query
        description: Lower bound on createdAt (ISO)
        schema:
          example: '2026-01-01'
          type: string
      - name: dateTo
        required: false
        in: query
        description: Upper bound on createdAt (ISO)
        schema:
          example: '2026-12-31'
          type: string
      - name: sort
        required: false
        in: query
        description: Sort token
        schema:
          type: string
      - name: marking
        required: false
        in: query
        description: Include only dialogs with this marking/messageType
        schema:
          type: string
      - name: excludeMarking
        required: false
        in: query
        description: Exclude dialogs with this marking
        schema:
          type: string
      - name: emailFolder
        required: false
        in: query
        description: IMAP folder path
        schema:
          type: string
      - name: starred
        required: false
        in: query
        description: true/false — starred only
        schema:
          type: string
      - name: includeDrafts
        required: false
        in: query
        description: true to include unsent drafts
        schema:
          type: string
      - name: pendingSend
        required: false
        in: query
        description: true for queued-but-not-sent outbox items
        schema:
          type: string
      - name: placement
        required: false
        in: query
        description: inbox-check placement bucket
        schema:
          enum:
          - inbox
          - spam
          - unchecked
          type: string
      - name: snoozed
        required: false
        in: query
        description: Snooze visibility filter
        schema:
          enum:
          - hidden
          - only
          - all
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: List dialogs with filters (channel, status, folder, etc.)
      tags:
      - Dialogs
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/dialogs/stats:
    get:
      operationId: DialogsController_getStats
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get aggregate dialog statistics
      tags:
      - Dialogs
      x-required-scope:
      - dialogs:read
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/dialogs/badges:
