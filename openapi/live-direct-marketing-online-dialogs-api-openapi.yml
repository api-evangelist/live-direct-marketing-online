components:
  schemas:
    ComposeAttachmentDto:
      type: object
      properties:
        filename:
          type: string
        contentBase64:
          type: string
        contentType:
          type: string
      required:
      - filename
      - contentBase64
    ComposeDto:
      type: object
      properties:
        accountId:
          type: string
        accountListId:
          type: string
        toEmail:
          type: string
          format: email
        toName:
          type: string
        fromName:
          type: string
        subject:
          type: string
        bodyText:
          type: string
        bodyHtml:
          type: string
        contactId:
          type: string
        companyId:
          type: string
        leadId:
          type: string
        scheduledAt:
          type: string
        timezone:
          type: string
        intentKey:
          type: string
          description: Validated business intent for customer outreach; LIVE without it is held.
        policyWindowDays:
          type: number
          minimum: 1
          maximum: 3650
        attachmentsJson:
          type: array
          items:
            $ref: '#/components/schemas/ComposeAttachmentDto'
      required:
      - toEmail
      - subject
  securitySchemes:
    jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: JWT access token from /auth/login (Bearer <token>)
    tenant-api-key:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Tenant API key (Bearer ldm_*) for MCP/A2A clients. Issued via CRM Settings → API Keys.
    rpa-service:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Dedicated RPA service key. No tenant API-key or query-key authentication.
