      security:
      - jwt: []
      summary: List email accounts used in dialogs
      tags:
      - Dialogs
      x-required-scope:
      - dialogs:read
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/dialogs/folders:
    get:
      operationId: DialogsController_getFolders
      parameters:
      - name: accountId
        required: false
        in: query
        description: Restrict folders to one account
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
