      - name: limit
        required: false
        in: query
        schema:
          maximum: 200
          example: 50
          type: number
      - name: cursor
        required: false
        in: query
        schema:
          type: string
      - name: revisionId
        required: false
        in: query
        description: Read one archived pre-send revision with content detail
