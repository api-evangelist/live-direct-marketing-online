      operationId: DialogsController_getOutbox
      parameters:
      - name: status
        required: false
        in: query
        description: Filter by outbox status (queued/sent/failed/...)
        schema:
          type: string
      - name: scheduled
        required: false
        in: query
        description: only=future-scheduled, none=immediate
        schema:
          enum:
          - only
          - none
          type: string
      - name: page
        required: false
        in: query
        description: 1-based page number
        schema:
          example: 1
          type: number
      - name: pageSize
        required: false
        in: query
        description: Items per page (default 20)
        schema:
          example: 20
          type: number
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
