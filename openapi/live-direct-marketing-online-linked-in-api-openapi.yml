openapi: 3.2.0
info:
  title: Live Direct Marketing Online LinkedIn API
  version: 1.0.0
  contact: {}
  description: 'Operations tagged LinkedIn across 2 of this provider''s published API definitions: live-direct-marketing-online-ldm-v3-openapi.json, live-direct-marketing-online-ldm-v3-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.live-direct-marketing.online
  description: Production
- url: https://api.dev.live-direct-marketing.online
  description: Development
- url: http://127.0.0.1:3000
  description: Local
tags:
- name: Linked In
paths:
  /api/linkedin/integration:
    get:
      operationId: LinkedinController_getIntegration
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: LinkedIn integration status (toggle, defaults)
      tags:
      - Linked In
      x-required-scope:
      - linkedin:read
    patch:
      operationId: LinkedinController_updateIntegration
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Enable/disable the module, kill-switch, defaults
      tags:
      - Linked In
      x-required-scope:
      - linkedin:write
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/linkedin/accounts:
