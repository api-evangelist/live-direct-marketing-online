    - url: http://127.0.0.1:3000
      description: Local
  /api/linkedin/campaigns/{id}/leads:
    post:
      operationId: LinkedinController_pourLeads
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
