      - name: from
        required: true
        in: query
        schema:
          type: string
      - name: to
        required: true
        in: query
        schema:
          type: string
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Aggregated tracking analytics (open rate, click rate, unique opens/clicks).
      tags:
      - Tracking
      x-required-scope:
      - mailing:read
    servers:
    - url: https://api.live-direct-marketing.online
