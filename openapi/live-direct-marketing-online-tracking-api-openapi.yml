      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Get tenant pixel tracking settings
      tags:
      - Tracking
      x-required-scope:
      - mailing:read
    patch:
      operationId: TrackingController_updatePixelSettings
      parameters:
      - name: X-Tenant-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
        description: Tenant UUID — required for all tenant-scoped endpoints
      responses:
        '200':
          description: ''
      security:
      - jwt: []
      summary: Update tenant pixel tracking settings
      tags:
      - Tracking
      x-required-scope:
      - mailing:write
    servers:
    - url: https://api.live-direct-marketing.online
      description: Production
    - url: https://api.dev.live-direct-marketing.online
      description: Development
    - url: http://127.0.0.1:3000
      description: Local
  /api/tracking/analytics/stats:
    get:
      operationId: TrackingController_getAnalyticsStats
      parameters:
      - name: taskId
        required: true
        in: query
        schema:
          type: string
      - name: dialogId
        required: true
        in: query
