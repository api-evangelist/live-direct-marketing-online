  applicable_standards_checked: [SCIM (identity), OpenRTB (advertising), ODATA (CRM data access), HL7/X12/ISO 20022 (not applicable)]
  finding: none
  note: >-
    No recognised domain-standard signature (SCIM URN, OData $metadata, OpenRTB bid endpoint,
    ActivityPub actor, OneRoster/LTI, OAI-PMH, ORCID/DataCite, HL7/X12/EDIFACT/ISO 20022) appears
    in either contract. The email standards the product enforces on OUTBOUND mail (SPF, DKIM, DMARC,
    RFC 8058) are what it tests for its customers, not a contract-level conformance of the API
    itself; RFC 8058 on the provider's own notification mail is recorded above. Reward-only check;
    nothing is claimed.
