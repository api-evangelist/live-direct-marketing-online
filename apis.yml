- aid: live-direct-marketing-online:ldm-webhook-events
  name: LDM Webhook Events
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    Outbound HTTPS webhook subscriptions for lead, dialog and task events (lead.created, lead.moved,
    lead.won, lead.lost, dialog.received, dialog.replied, task.completed, task.failed), signed with
    X-LDM-Signature sha256=<HMAC-SHA256 of the raw body>, with a delivery log, single-delivery retry
    and last-N retrigger. No AsyncAPI document is published.
  humanURL: https://developers.live-direct-marketing.online/webhooks
  baseURL: https://api.live-direct-marketing.online
