apis:
- aid: live-direct-marketing-online:ldm-mcp-server
  name: LDM MCP Server
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    Remote Streamable-HTTP MCP server at https://api.live-direct-marketing.online/mcp (protocol 2025-06-18,
    server ldm-delivery 0.6.1). An anonymous session exposes three bootstrap tools — ldm_health, ldm_terms,
    ldm_register — and a Bearer ldm_* session exposes one tool per API operation named ldm_<operationId>
    (about 1,270 per the agent guide), each response carrying an _expert guidance block. The same package
    (@live-direct-marketing/sdk) ships ldm-mcp, a stdio server that generates its tools from the live
    agent card at connect time.
  humanURL: https://live-direct-marketing.online/academy/mcp-flow
  baseURL: https://api.live-direct-marketing.online/mcp
  tags:
  - MCP
