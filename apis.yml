apis:
- aid: live-direct-marketing-online:ldm-v3-api
  name: LDM v3 API
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    Multi-tenant B2B outreach automation platform exposed as one Bearer-authenticated HTTPS surface
    for the web UI, MCP and A2A clients. 1,304 operations across 119 tags: companies, contacts,
    leads and pipelines, briefs and creatives, mailing tasks and campaigns with send-readiness
    dry-runs, email accounts and warm-up, three-phase deliverability probes, suppression / stop-list
    / marking guardrails, webhooks, billing ledger, legal documents and a public DSAR endpoint.
    Tenant-scoped calls carry X-Tenant-Id; 406 operations declare x-required-scope from a 79-scope
    catalog. Self-serve registration returns a PENDING-account ldm_* key immediately.
  humanURL: https://developers.live-direct-marketing.online/
