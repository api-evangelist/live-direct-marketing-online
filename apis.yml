- aid: live-direct-marketing-online:inbox-check-mcp-server
  name: Inbox Check MCP Server
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    Remote Streamable-HTTP MCP server at https://check.live-direct-marketing.online/mcp requiring Authorization:
    Bearer icp_live_* (anonymous tools/list answers 401 Problem Details). Tools mirror the agent card
    skills — tests_create, tests_get, tests_list, tests_recheck, monitor_domain_*, providers_list, me_get
    — plus five inbox_check_* compatibility aliases from the older stdio package ldm-inbox-check-mcp 1.0.0
    on npm.
  humanURL: https://check.live-direct-marketing.online/docs/mcp
