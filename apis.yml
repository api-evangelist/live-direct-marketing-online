- aid: live-direct-marketing-online:inbox-check-a2a-agent
  name: Inbox Check A2A Agent Card
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    Provider-shaped agent card at https://check.live-direct-marketing.online/.well-known/agent.json
    listing 21 REST-bound skills with HTTP method, URL and input_schema. The provider states that
