- aid: live-direct-marketing-online:ldm-a2a-agent
  name: LDM.delivery A2A Agent
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    A2A 0.3.0-shaped agent card served at https://api.live-direct-marketing.online/.well-known/agent.json
    (237 curated skills of 1,270, ?full=1 for all; capabilities streaming + pushNotifications) with
    a JSON-RPC 2.0 dispatcher at POST /api/a2a that answers 401 Problem Details without a Bearer
    ldm_* key. Pointer cards on the brand, app and developer-portal hosts delegate to this live card.
  humanURL: https://developers.live-direct-marketing.online/agent-card
