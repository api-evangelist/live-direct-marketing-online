- aid: live-direct-marketing-online:inbox-check-api
  name: Inbox Check API
  image: https://live-direct-marketing.online/img/logo.png
  description: >-
    Email deliverability test API behind the free Inbox Placement Test at check.live-direct-marketing.online:
    create a test, send to the returned seed mailboxes across ten providers, poll placement, SPF /
    DKIM / DMARC and spam-engine verdicts, schedule same-message rechecks, and run continuous domain
    monitoring. Bearer icp_live_* keys with daily / monthly quotas; the OpenAPI 3.0 document covers
    196 operations including the public /api/v1 tier, the account portal and admin surfaces.
  humanURL: https://check.live-direct-marketing.online/docs
  baseURL: https://check.live-direct-marketing.online
  tags:
  - Email Deliverability
  - Email
