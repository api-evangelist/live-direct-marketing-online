aid: live-direct-marketing-online
name: Live Direct Marketing
description: >-
  Live Direct Marketing (LDM) is a B2B outreach and CRM platform built to be operated by AI agents:
  the same Bearer-authenticated HTTPS surface serves the web UI, MCP clients and A2A peers. The
  LDM v3 API publishes an OpenAPI 3.0 contract with 1,304 operations across 119 tags (companies,
  contacts, leads, pipelines, campaigns, creatives, mailboxes, deliverability probes, suppression
  and stop-lists, webhooks, billing, DSAR) and a remote Streamable-HTTP MCP server with an anonymous
  bootstrap (ldm_terms / ldm_register) that mints a scoped ldm_* key without a human. A second
  product, Inbox Check, is a free inbox-placement test with its own 196-operation OpenAPI, a remote
  MCP server and an A2A agent card at check.live-direct-marketing.online. Billing is per confirmed
  inbox delivery ($0.015 managed / $0.005 BYOC), read from a public pricing endpoint. The operator
  is a Russian entity (OOO LDM, Yaroslavl); legal documents are drafts pending lawyer review.
image: https://live-direct-marketing.online/img/logo.png
url: https://raw.githubusercontent.com/api-evangelist/live-direct-marketing-online/refs/heads/main/apis.yml
