note: 'Neither OpenAPI declares an oauth2 securityScheme and the provider publishes no OAuth authorization server
  (its RFC 9728 document says authorization_servers: []). What it DOES publish is a fine-grained scope model attached
  to Bearer API keys: the LDM OpenAPI stamps x-required-scope on 406 operations, the A2A card lists 79 scopes, and
  per-method @RequireScope checks are described in the authentication docs. This file records that catalog under
  the OAuthScopes pointer because it is the scope contract an agent must satisfy; the credential is a static ldm_*
  key, not an OAuth token. Inbox Check keys carry a smaller scope set. derive-oauth-scopes.py produced nothing for
  this repo, correctly.'
issuance:
  ldm: Keys are minted in CRM Settings → API Keys with chosen scopes, or auto-issued at POST /api/auth/register
    (channel mcp/a2a/form) with SAFE_AGENT_SCOPES = read-all + safe drafts, explicitly excluding email:send and
    mailing:write until the owner expands them after activation.
  inbox_check: Keys are self-issued at /account (up to 3 active); monitoring:write must be ticked at creation; reports:pdf
    is tier/feature gated.
