generated: '2026-09-19'
method: derived
source: 'Derived by binding (a) the three tools returned by an anonymous live tools/list against https://api.live-direct-marketing.online/mcp
  on 2026-09-19, (b) the 237 curated capabilities in the provider''s proprietary agent card (each carries method
  + path), and (c) the 21 skills in the Inbox Check agent card (each carries method + url) to the operationIds in
  the two harvested OpenAPI documents by exact method+path match. The provider states the naming rule outright in
  /api/v1/agent-guide: ''Each capability is one MCP tool named ldm_<operationId>''.'
purpose: Make the MCP tool the discovery unit and bind it to the REST operation it wraps. For LDM this is unusually
  mechanical — REST, MCP and A2A are all generated from the same OpenAPI, so a bound tool inherits the operation's
  parameters + requestBody as its real inputSchema (path params become top-level string args, the body goes in `body`,
  tenant in `tenant_id`, per the agent guide).
surfaces:
  rest_openapi:
  - openapi/live-direct-marketing-online-ldm-v3-openapi.json (1,304 operations, 119 tags)
  - openapi/live-direct-marketing-online-inbox-check-openapi.json (196 operations)
  graphql: null
  mcp:
  - endpoint: https://api.live-direct-marketing.online/mcp
    tools_list: anonymous session returns 3 bootstrap tools (live); authenticated session exposes ldm_<operationId>
      per operation (~1,270 per the agent guide) — authenticated introspection not performed
  - endpoint: https://check.live-direct-marketing.online/mcp
    tools_list: 401 without Bearer icp_live_*; tool names taken from the agent card skills and the /docs/mcp page
  a2a: https://api.live-direct-marketing.online/.well-known/agent.json (237 curated skills; skill ids are dotted
    capability ids, not operationIds)
naming_rule:
  ldm: ldm_<operationId> (e.g. ldm_CampaignsController_pour); some curated tools use short aliases such as ldm_contacts_create,
    ldm_creatives_create and ldm_dialogs_list per the agent guide recommended_flow
  inbox_check: <domain>_<verb> (tests_create, monitor_domain_pause, me_get) with input_schema published in the card
