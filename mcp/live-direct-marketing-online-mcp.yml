generated: '2026-09-19'
method: probed
status: published
source: https://api.live-direct-marketing.online/mcp
docs:
  - https://live-direct-marketing.online/academy/mcp-flow
  - https://developers.live-direct-marketing.online/
  - https://check.live-direct-marketing.online/docs/mcp
